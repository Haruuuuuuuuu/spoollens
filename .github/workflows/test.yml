name: Extraction and safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Exact extraction and safety contract
        run: python -m unittest discover -s tests -v
      - name: Frozen evidence unchanged
        run: cd tests/fixtures && sha256sum -c SHA256SUMS
      - name: Installed CLI and compilation
        run: |
          spoollens --help
          python -m compileall -q spoollens
