[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spoollens"
version = "0.1.0"
description = "Offline visual fixed-width report extraction with provenance and safe exports"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
spoollens = "spoollens.__main__:main"

[tool.setuptools]
packages = ["spoollens"]
